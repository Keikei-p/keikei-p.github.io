name: 通信コンパス 自動メンテナンス

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 3日ごとの記事・表示点検
        env:
          FORCE_MAINTENANCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/content-maintenance.mjs

      - name: 安全な修正とレポートを保存
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "変更はありません。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 3日ごとの自動メンテナンス"
          git push
