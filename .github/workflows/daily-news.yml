name: 通信コンパス 毎日公式情報更新

on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/daily-news.mjs"
      - ".github/workflows/daily-news.yml"

permissions:
  contents: write

concurrency:
  group: daily-telecom-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 主要通信会社の公式情報を確認
        run: node scripts/daily-news.mjs

      - name: 更新を公開
        shell: bash
        run: |
          if git diff --quiet; then
            echo "公開内容に変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html daily-news.html
          git commit -m "content: daily official telecom update"
          git push
