<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wi-Fi診断 | つうしんコンパス</title>
<meta name="description" content="7つの質問に答えるだけで、光回線・ホームルーター・モバイルWi-Fiのどれが自分に合いそうかがわかる診断です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="wifi.css">
</head>
<body>

<header class="site-header">
<div class="container">
<a class="brand" href="index.html">
<svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
<circle cx="16" cy="16" r="13" fill="none" stroke="#0f6e8c" stroke-width="2"></circle>
<polygon points="16,7 20,16 16,16" fill="#ff6b4a"></polygon>
<polygon points="16,25 12,16 16,16" fill="#0f6e8c"></polygon>
<circle cx="16" cy="16" r="2" fill="#16232e"></circle>
</svg>
<span class="brand-name">つうしんコンパス</span>
</a>
<button class="nav-toggle" aria-label="メニューを開く" aria-expanded="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
<line x1="3" y1="6" x2="21" y2="6"></line>
<line x1="3" y1="12" x2="21" y2="12"></line>
<line x1="3" y1="18" x2="21" y2="18"></line>
</svg>
</button>
<nav class="site-nav">
<a href="index.html#menu">診断メニュー</a>
<a href="index.html#about">このサイトについて</a>
</nav>
</div>
</header>

<main>
<section class="diag-shell">
<div class="container container-narrow">

<div class="diag-page-head">
<h1>Wi-Fi診断</h1>
<p>7つの質問に答えるだけで、光回線・ホームルーター・モバイルWi-Fiのどれが合いそうかがわかります。</p>
</div>

<!-- 質問画面 -->
<div class="diag-quiz" id="quiz">
<div class="diag-progress">
<p class="diag-progress-label">
質問 <span id="q-current">1</span> / <span id="q-total">7</span>
</p>
<div class="progress-track" id="progress-track" role="progressbar" aria-label="診断の進み具合" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1">
<div class="progress-fill" id="progress-fill"></div>
</div>
</div>

<h2 class="diag-question" id="question-title" tabindex="-1">質問を読み込み中です</h2>
<p class="wifi-hint" id="q-hint" hidden></p>

<div class="option-list wifi-options" id="option-list"></div>

<button type="button" class="back-link" id="back-btn" hidden>ひとつ前の質問に戻る</button>

<noscript><p class="wifi-hint">この診断はJavaScriptを有効にするとご利用いただけます。</p></noscript>
</div>

<!-- 結果画面 -->
<div class="diag-result" id="result" hidden>
<div class="wifi-compass" id="result-compass" aria-hidden="true"></div>
<p class="result-lead">あなたに合いそうなのは</p>
<h2 class="result-type" id="result-type" tabindex="-1">診断結果</h2>
<p class="wifi-tagline" id="result-tagline"></p>
<p class="result-desc" id="result-desc"></p>

<div id="result-extra"></div>

<div class="result-actions">
<a class="btn btn-primary" id="result-next" href="index.html#menu">ほかの診断を見る</a>
<button type="button" class="btn btn-ghost" id="retry-btn">もう一度診断する</button>
</div>
<p class="wifi-back"><a href="index.html">トップページに戻る</a></p>
</div>

</div>
</section>
</main>

<footer class="site-footer">
<div class="container">
<p class="footer-name">つうしんコンパス</p>
<p class="footer-note">診断結果は一般的な傾向を示すものであり、特定のサービスや料金を保証するものではありません。提供エリア・料金・契約条件は、各社の公式サイトでご確認ください。</p>
</div>
</footer>

<script src="script.js"></script>
<script src="wifi-diagnosis.js"></script>
</body>
</html>
